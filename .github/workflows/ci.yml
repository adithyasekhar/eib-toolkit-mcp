name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev,mcp]"
      - run: pytest
      - run: ruff check .
      - name: CLI end-to-end smoke (synthetic fixtures)
        run: |
          set -euxo pipefail
          python tests/make_smoke_fixtures.py /tmp/smoke
          eib-toolkit inspect /tmp/smoke/template.xlsx
          eib-toolkit inspect /tmp/smoke/template.xlsx --format markdown > /dev/null
          eib-toolkit draft-spec /tmp/smoke/template.xlsx > /dev/null
          eib-toolkit generate /tmp/smoke/template.xlsx --spec /tmp/smoke/spec.yaml -o /tmp/smoke/load.xlsx
          eib-toolkit validate /tmp/smoke/load.xlsx
          eib-toolkit validate /tmp/smoke/filled.xlsx --format json > /dev/null
          eib-toolkit diff /tmp/smoke/filled.xlsx /tmp/smoke/load.xlsx
